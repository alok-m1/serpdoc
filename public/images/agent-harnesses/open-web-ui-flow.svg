<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 190" fill="none" role="img" aria-label="Open WebUI to SERPHouse search flow">
  <defs>
    <linearGradient id="boxFillLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f1"/>
    </linearGradient>
    <linearGradient id="boxFillDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28282c"/>
      <stop offset="100%" stop-color="#1d1d20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#000000" opacity="0.03"/>
    </pattern>
  </defs>

  <style>
    .panel { fill: #fafafa; }
    .dotpattern { fill: url(#dots); }
    .box { fill: url(#boxFillLight); stroke: #e4e4e7; stroke-width: 1; }
    .iconbg { fill: #e4e4e7; }
    .icon { stroke: #52525b; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icondot { fill: #52525b; }
    .label { fill: #27272a; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: -0.1px; }
    .sub { fill: #71717a; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; }
    .num { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; }
    .arrow { stroke: #a1a1aa; stroke-width: 2; fill: none; }
    .arrowhead { fill: #a1a1aa; }
    .kicker { fill: #a1a1aa; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }

    @media (prefers-color-scheme: dark) {
      .panel { fill: #141417; }
      .dotpattern { opacity: 0.5; }
      .box { fill: url(#boxFillDark); stroke: #35353b; }
      .iconbg { fill: #3a3a3f; }
      .icon { stroke: #d4d4d8; }
      .icondot { fill: #d4d4d8; }
      .label { fill: #fafafa; }
      .sub { fill: #a1a1aa; }
      .kicker { fill: #71717a; }
    }
  </style>

  <!-- backdrop -->
  <rect class="panel" x="0" y="0" width="754" height="190" rx="20"/>
  <rect class="dotpattern" x="0" y="0" width="754" height="190" rx="20"/>

  <text class="kicker" x="24" y="26">SEARCH FLOW</text>

  <!-- Step 1: Chat -->
  <g filter="url(#softShadow)"><rect class="box" x="24" y="46" width="148" height="100" rx="16"/></g>
  <circle cx="44" cy="66" r="11" fill="url(#accent)"/>
  <text class="num" x="44" y="70" text-anchor="middle">1</text>
  <circle class="iconbg" cx="98" cy="88" r="15"/>
  <g transform="translate(98,88)" class="icon">
    <path d="M-8,-4 a4,4 0 0 1 4,-4 h8 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-8 l-4,3 v-3 a4,4 0 0 1 -4,-4 z"/>
  </g>
  <text class="label" x="98" y="120" text-anchor="middle">User chat</text>
  <text class="sub" x="98" y="136" text-anchor="middle">Enable + search</text>

  <!-- Arrow 1 -->
  <path class="arrow" d="M180 96 H210"/>
  <path class="arrowhead" d="M208 90 L221 96 L208 102 Z"/>

  <!-- Step 2: Open WebUI -->
  <g filter="url(#softShadow)"><rect class="box" x="210" y="46" width="148" height="100" rx="16"/></g>
  <circle cx="230" cy="66" r="11" fill="url(#accent)"/>
  <text class="num" x="230" y="70" text-anchor="middle">2</text>
  <circle class="iconbg" cx="284" cy="88" r="15"/>
  <g transform="translate(284,88)" class="icon">
    <rect x="-9" y="-7" width="18" height="14" rx="2.5"/>
    <line x1="-9" y1="-2.5" x2="9" y2="-2.5"/>
  </g>
  <text class="label" x="284" y="120" text-anchor="middle">Open WebUI</text>
  <text class="sub" x="284" y="136" text-anchor="middle">Engine: serphouse</text>

  <!-- Arrow 2 -->
  <path class="arrow" d="M366 96 H396"/>
  <path class="arrowhead" d="M394 90 L407 96 L394 102 Z"/>

  <!-- Step 3: SERPHouse -->
  <g filter="url(#softShadow)"><rect class="box" x="396" y="46" width="148" height="100" rx="16"/></g>
  <circle cx="416" cy="66" r="11" fill="url(#accent)"/>
  <text class="num" x="416" y="70" text-anchor="middle">3</text>
  <circle class="iconbg" cx="470" cy="88" r="15"/>
  <g transform="translate(470,88)" class="icon">
    <circle cx="-3" cy="-3" r="6"/>
    <line x1="1.2" y1="1.2" x2="7" y2="7"/>
  </g>
  <text class="label" x="470" y="120" text-anchor="middle">SERPHouse</text>
  <text class="sub" x="470" y="136" text-anchor="middle">Live SERP results</text>

  <!-- Arrow 3 -->
  <path class="arrow" d="M552 96 H582"/>
  <path class="arrowhead" d="M580 90 L593 96 L580 102 Z"/>

  <!-- Step 4: Model -->
  <g filter="url(#softShadow)"><rect class="box" x="582" y="46" width="148" height="100" rx="16"/></g>
  <circle cx="602" cy="66" r="11" fill="url(#accent)"/>
  <text class="num" x="602" y="70" text-anchor="middle">4</text>
  <circle class="iconbg" cx="656" cy="88" r="15"/>
  <g transform="translate(656,88)" class="icon">
    <rect x="-8" y="-5" width="16" height="10" rx="2.5"/>
    <line x1="0" y1="-5" x2="0" y2="-8"/>
    <circle class="icondot" cx="-3" cy="0" r="1.3" stroke="none"/>
    <circle class="icondot" cx="3" cy="0" r="1.3" stroke="none"/>
  </g>
  <text class="label" x="656" y="120" text-anchor="middle">Model</text>
  <text class="sub" x="656" y="136" text-anchor="middle">Cites sources</text>
</svg>
